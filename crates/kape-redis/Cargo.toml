[package]
name = "kape-redis"
description = "Redis backend adapter for Kape."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/kape-redis"
keywords = ["cache", "caching", "redis", "async"]
categories = ["caching", "asynchronous", "database"]

[features]
default = []
native-tls = ["redis/tokio-native-tls-comp"]
rustls = ["redis/tokio-rustls-comp"]

[dependencies]
async-trait.workspace = true
kape.workspace = true
redis.workspace = true
thiserror.workspace = true

[dev-dependencies]
kape-testkit = { path = "../kape-testkit" }
tokio.workspace = true

[lints]
workspace = true
