<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Kape cache chains for Rust</title>
  <desc id="desc">Kape logo with a crab and an ordered memory, Redis, and PostgreSQL cache chain.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06172b"/>
      <stop offset="1" stop-color="#020b17"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9838"/>
      <stop offset="1" stop-color="#f46f24"/>
    </linearGradient>
    <linearGradient id="cache" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#32c8ff"/>
      <stop offset="1" stop-color="#1689d8"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#154066" stroke-opacity=".24"/>
      <circle cx="0" cy="0" r="2" fill="#1c5889" fill-opacity=".34"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5 0 10Z" fill="#ff8a32"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5 0 10Z" fill="#28baff"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>

  <!-- Kape cache-layer mark -->
  <g transform="translate(430 34)" filter="url(#glow)">
    <path d="M58 0 108 29v58l-50 29L8 87V29Z" fill="#07182a" stroke="#ff8a32" stroke-width="6"/>
    <path d="M29 29v43M31 50l30-21M31 50l31 23" fill="none" stroke="url(#brand)" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"/>
    <path d="m29 84 29 16 29-16M39 76l19 10 19-10" fill="none" stroke="url(#cache)" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>
  </g>

  <!-- Multiplication sign -->
  <g fill="none" stroke="#dbe8f2" stroke-linecap="square" stroke-width="6">
    <path d="m584 70 32 32M616 70l-32 32"/>
  </g>

  <!-- Preferred crab -->
  <g transform="translate(650 38) scale(1.05)" fill="#ff8730">
    <!-- Filled, tapered legs matching the preferred crab silhouette -->
    <path d="M25 45C12 41 5 46 1 57c8-6 15-6 26-3ZM22 54C10 54 5 62 5 74c7-8 14-10 24-10ZM29 64c-9 5-11 14-7 24 4-9 9-14 17-18ZM75 45c13-4 20 1 24 12-8-6-15-6-26-3ZM78 54c12 0 17 8 17 20-7-8-14-10-24-10ZM71 64c9 5 11 14 7 24-4-9-9-14-17-18Z"/>
    <!-- Curved arms -->
    <path d="M29 40C17 35 12 27 13 20M71 40c12-5 17-13 16-20" fill="none" stroke="#ff8730" stroke-linecap="round" stroke-width="7"/>
    <!-- Large rounded pincers with deep notches -->
    <ellipse cx="13" cy="14" rx="13" ry="17"/>
    <ellipse cx="87" cy="14" rx="13" ry="17"/>
    <path d="M10-4h7l-1 11-3 8-3-8ZM83-4h7v11l-3 8-3-8Z" fill="#07182a"/>
    <!-- Wide rounded body -->
    <ellipse cx="50" cy="53" rx="34" ry="24"/>
    <!-- Black eyes with white highlights -->
    <circle cx="40" cy="47" r="5" fill="#07182a"/>
    <circle cx="60" cy="47" r="5" fill="#07182a"/>
    <circle cx="38.5" cy="45.5" r="1.5" fill="#fff"/>
    <circle cx="58.5" cy="45.5" r="1.5" fill="#fff"/>
    <path d="M42 59c5 5 11 5 16 0" fill="none" stroke="#07182a" stroke-linecap="round" stroke-width="3"/>
  </g>
  <text x="600" y="184" text-anchor="middle" fill="#e8f1f8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="550">Composable, type-safe cache chains for Rust</text>

  <!-- Ordered cache chain -->
  <g transform="translate(172 228)">
    <g filter="url(#glow)">
      <rect x="0" y="0" width="128" height="112" rx="22" fill="#091a2c" stroke="#ff8a32" stroke-width="4"/>
      <rect x="42" y="31" width="44" height="44" rx="5" fill="none" stroke="#ff8a32" stroke-width="7"/>
      <path d="M49 20v11M64 20v11M79 20v11M49 75v12M64 75v12M79 75v12M31 38h11M31 53h11M31 68h11M86 38h11M86 53h11M86 68h11" stroke="#ff8a32" stroke-width="6"/>
    </g>
    <text x="64" y="143" text-anchor="middle" fill="#ff8a32" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="700" letter-spacing="2">MEMORY</text>

    <path d="M151 56H340" fill="none" stroke="#ff8a32" stroke-width="5" marker-end="url(#arrow-orange)"/>

    <g transform="translate(364)" filter="url(#glow)">
      <rect width="128" height="112" rx="22" fill="#091a2c" stroke="#28baff" stroke-width="4"/>
      <path d="m64 25 34 18-34 18-34-18ZM30 57l34 18 34-18M30 72l34 18 34-18" fill="none" stroke="#28baff" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>
    </g>
    <text x="428" y="143" text-anchor="middle" fill="#28baff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="700" letter-spacing="2">REDIS</text>

    <path d="M515 56H704" fill="none" stroke="#28baff" stroke-width="5" marker-end="url(#arrow-blue)"/>

    <g transform="translate(728)" filter="url(#glow)">
      <rect width="128" height="112" rx="22" fill="#091a2c" stroke="#e5eef5" stroke-width="4"/>
      <ellipse cx="64" cy="34" rx="29" ry="13" fill="none" stroke="#e5eef5" stroke-width="6"/>
      <path d="M35 34v43c0 8 13 14 29 14s29-6 29-14V34M35 55c0 8 13 14 29 14s29-6 29-14" fill="none" stroke="#e5eef5" stroke-width="6"/>
    </g>
    <text x="792" y="143" text-anchor="middle" fill="#e5eef5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="700" letter-spacing="2">POSTGRESQL</text>

    <!-- Reverse refill path -->
    <path d="M792 165H64" fill="none" stroke="#b8d7ea" stroke-dasharray="5 11" stroke-linecap="round" stroke-width="4" marker-end="url(#arrow-orange)" opacity=".9"/>
  </g>
</svg>
